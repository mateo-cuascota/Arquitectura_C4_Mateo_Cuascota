server:
  port: ${PORT:8081}

spring:
  application:
    name: sri-service
  config:
    # Lee REDIS_URL desde el .env de la raiz (misma cache en la nube que el ANT Service)
    import: "optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]"
  cache:
    type: redis
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 3s

sri:
  base-url: https://srienlinea.sri.gob.ec
  timeout-ms: 8000
  cache:
    ttl: ${SRI_CACHE_TTL:PT6H}   # respuestas del SRI guardadas en Redis

# Registro Civil via Didit (opcional): nombre por cedula para personas sin RUC.
# Crea una cuenta en https://business.didit.me y pon DIDIT_API_KEY en el .env (500 consultas gratis/mes).
didit:
  base-url: https://verification.didit.me
  api-key: ${DIDIT_API_KEY:}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
